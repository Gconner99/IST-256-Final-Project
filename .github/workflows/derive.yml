name: Dérive

on:
  push:
    branches: [master, main]
    paths:
      - "derive/**"
      - ".github/workflows/derive.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "derive/**"
      - ".github/workflows/derive.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: derive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: derive/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
